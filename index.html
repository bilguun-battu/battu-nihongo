<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battu Nihongo — Япон хэл</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8302f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Battu Nihongo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1d2233;--muted:#6b6f7e;--line:#e6dccb;--red:#c8302f;--red2:#fbe6e3;--ind:#2c3e73;--ind2:#e6eaf5;--green:#2f8f5b;--green2:#e2f3e9;--gold:#c98a12;--gold2:#fcefd2;--r:18px;--sh:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,'Noto Sans JP',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.jp{font-family:'Klee One','Noto Sans JP',serif}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-size:26px;margin:6px 0 14px;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
#app{display:flex;min-height:100vh}
#nav{position:fixed;z-index:20;background:var(--card);border-top:1px solid var(--line);bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 8px;border-radius:12px;min-width:58px}
#nav button .ic{font-size:21px;line-height:1.1}
#nav button.on{color:var(--red);background:var(--red2)}
#nav .brand{display:none}
main{flex:1;min-width:0;padding:0 16px 96px;max-width:860px;margin:0 auto}
#top{display:flex;align-items:center;gap:10px;padding:14px 0 6px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.sun{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;font-size:13px}
.chips{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.syncdot{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block}
.syncdot.cloud{background:var(--green)} .syncdot.syncing{background:var(--gold)} .syncdot.err{background:var(--red)}
@media(min-width:900px){
 #nav{top:0;bottom:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:18px 12px;gap:4px}
 #nav .brand{display:flex;margin:0 6px 18px}
 #top .logo{visibility:hidden}
 #nav button{flex-direction:row;font-size:15px;gap:10px;padding:10px 12px;justify-content:flex-start}
 #app{padding-left:200px}
 main{padding-bottom:40px}
}
body.in-session #nav{display:none}
body.in-session #app{padding-left:0}
body.in-session #top{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mode{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;transition:transform .08s}
.mode:active{transform:scale(.97)}
.mode .mi{font-size:28px;line-height:1.2}
.mode b{font-size:15px}
.mode span{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 16px;font-weight:800;font-size:15px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ind{background:var(--ind);border-color:var(--ind);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.wide{width:100%;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:18px;display:inline-grid;place-items:center}
.hero{display:flex;gap:16px;align-items:center}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:15px;line-height:1.1}
.ring small{font-size:10px;color:var(--muted);font-weight:600}
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lvl{flex:1;min-width:120px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;text-align:left}
.lvl.on{border-color:var(--red);background:var(--red2)}
.lvl b{display:block;font-size:15px}
.lvl small{color:var(--muted);font-size:12px}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--green);border-radius:9px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{width:64px;text-align:center;font-size:11px;line-height:1.2}
.badge .be{width:48px;height:48px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--gold2);border:2px solid #f0d48f}
.badge.off{opacity:.35;filter:grayscale(1)}
.cta{display:flex;align-items:center;gap:12px;background:var(--ind);color:#fff;border:0;border-radius:var(--r);padding:16px;width:100%;text-align:left;margin-bottom:14px;box-shadow:var(--sh)}
.cta .big{font-size:30px}
.cta b{font-size:17px;display:block}
/* session */
.session{max-width:640px;margin:0 auto;padding-top:14px}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog{flex:1;height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.prog>div{height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.combo{font-weight:800;opacity:.25;min-width:44px;text-align:right}
.combo.on{opacity:1;color:var(--red)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:var(--sh);text-align:center;position:relative}
.qlabel{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.bigword{font-size:52px;line-height:1.35;margin:4px 0}
.bigword ruby rt{font-size:16px;color:var(--muted)}
.romaji{color:var(--ind);font-weight:700;letter-spacing:.03em}
.qcard .say{position:absolute;top:12px;right:12px}
.mnbig{font-size:26px;font-weight:800;margin:10px 0}
.mnsmall{font-size:17px;color:var(--muted);margin:4px 0 12px}
.sent{font-size:28px;line-height:1.6;margin:8px 0}
.bigplay{width:96px;height:96px;border-radius:50%;border:0;background:var(--ind);color:#fff;font-size:40px;box-shadow:var(--sh);margin:8px 0}
.choices{display:grid;gap:10px;margin-top:16px}
@media(min-width:560px){.choices{grid-template-columns:1fr 1fr}}
.choice{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-size:17px;font-weight:700;min-height:58px}
.choice .num{width:24px;height:24px;flex:none;border-radius:8px;background:var(--bg);font-size:12px;display:grid;place-items:center;color:var(--muted)}
.choice .ctext{display:flex;flex-direction:column}
.choice .ctext .jp{font-size:24px;font-weight:600}
.choice small{font-size:13px;color:var(--muted);font-weight:600}
.choice.ok{border-color:var(--green);background:var(--green2)}
.choice.bad{border-color:var(--red);background:var(--red2)}
.choice:disabled{cursor:default;color:var(--ink)}
.feedback{margin-top:14px;border-radius:20px;padding:16px;border:2px solid}
.feedback.good{background:var(--green2);border-color:#a9dcbf}
.feedback.bad{background:var(--red2);border-color:#f0b9b2}
.fbhead{font-weight:800;font-size:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gain{color:var(--gold);font-size:15px}
.explain{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px}
.explain .jp{font-size:24px}
.typeform input{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:14px;text-align:center;font-family:Nunito,'Noto Sans JP',sans-serif;margin-top:12px;background:#fff}
.typeform input:focus{outline:none;border-color:var(--ind)}
.typeform input.ok{border-color:var(--green)} .typeform input.bad{border-color:var(--red)}
.kprev{font-size:26px;min-height:40px;margin:8px 0;color:var(--ind)}
.micbtn{width:100px;height:100px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:42px;margin:14px auto 6px;display:block;box-shadow:var(--sh)}
.micbtn.rec{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,48,47,.5)}100%{box-shadow:0 0 0 22px rgba(200,48,47,0)}}
.padwrap{display:flex;justify-content:center;margin:10px 0 12px}
canvas#pad{border:2px solid var(--line);border-radius:18px;touch-action:none;background:#fffdf8}
.wprompt{font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.wscore{font-size:18px;margin-top:6px}
/* flashcard */
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.flash .meaning{font-size:26px;font-weight:800;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rate .btn{padding:12px 6px;font-size:14px}
.rate .b0{background:var(--red2);border-color:#f0b9b2}
.rate .b1{background:var(--gold2);border-color:#efd59a}
.rate .b2{background:var(--green2);border-color:#a9dcbf}
/* kana grid */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:800}
.tabs button.on{background:var(--ind);color:#fff}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kgrid.y{grid-template-columns:repeat(3,1fr)}
.kc{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 2px;text-align:center}
.kc .k{font-size:28px;display:block;line-height:1.25}
.kc small{font-size:11px;color:var(--muted);font-weight:700}
.kc.p1{background:#f3f7ee}.kc.p2{background:#e2f3e9;border-color:#a9dcbf}.kc.p3{background:#c9ebd6;border-color:#7cc59b}
.kc.empty{visibility:hidden}
.result{text-align:center;padding:26px 18px}
.result .pct{font-size:56px;font-weight:800;line-height:1}
.result .stats{display:flex;justify-content:center;gap:10px;margin:16px 0;flex-wrap:wrap}
.pill{background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:800}
.wl{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.wl:last-child{border:0}
.wl .jp{font-size:21px;min-width:96px}
.wl .r{font-size:13px;color:var(--muted)}
.wl .m{flex:1}
.dots{font-size:10px;letter-spacing:1px;color:var(--green);white-space:nowrap}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border:0}
.coinbig{text-align:center;background:linear-gradient(135deg,#fff7e3,#fffdf8)}
.coins{font-size:44px;font-weight:800;color:var(--gold)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
select,input[type=text],input[type=number],input[type=password],textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
.prof{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--line);margin-bottom:8px;background:#fff}
.prof.on{border-color:var(--red);background:var(--red2)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ind);color:#fff;display:grid;place-items:center;font-weight:800}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:var(--sh);animation:tin .25s;max-width:90vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#modal{position:fixed;inset:0;background:rgba(20,20,30,.4);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal .box input,#modal .box textarea{width:100%;margin:10px 0;font-size:17px}
.confetti{position:fixed;top:-40px;z-index:70;font-size:24px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.notice{background:var(--gold2);border:1px solid #efd59a;border-radius:14px;padding:10px 12px;font-size:13px;margin:10px 0}
</style>
</head>

 </main>
</div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

function toRomaji(s){
 s=toHira(s); let out='', dbl=false;
 for(let i=0;i<s.length;i++){
  const two=s.substr(i,2); let r;
  if(two.length===2 && K2R[two]){ r=K2R[two]; i++; }
  else { const c=s[i];
   if(c==='っ'){dbl=true;continue;}
   if(c==='ー'){ const m=out.match(/[aiueo]$/); out+=m?m[0]:''; continue; }
   r = K2R[c]; if(r===undefined) r=c; }
  if(dbl){ if(r.startsWith('ch')) out+='t'; else if(/^[bcdfghjkmpqrstvwxyz]/.test(r)) out+=r[0]; dbl=false; }
  out+=r;
 }
 return out;
}
function toKana(s){
 s=s.toLowerCase(); let out='', i=0;
 while(i<s.length){
  const c=s[i], n1=s[i+1];
  if(!/[a-z'\-]/.test(c)){ out+=c; i++; continue; }
  if(c==='-'){ out+='ー'; i++; continue; }
  if(c==="'"){ i++; continue; }
  if(c==='n'){
   if(n1===undefined){ out+='ん'; i++; continue; }
   if(n1==='n'){ const n2=s[i+2]; if(n2===undefined||!/[aiueoy]/.test(n2)){ out+='ん'; i+=2; continue; } out+='ん'; i++; continue; }
   if(n1==="'"){ out+='ん'; i+=2; continue; }
   if(!/[aiueoy]/.test(n1)){ out+='ん'; i++; continue; }
  }
  if(c===n1 && /[bcdfghjkmpqrstvwxyz]/.test(c)){ out+='っ'; i++; continue; }
  if(c==='t' && n1==='c' && s[i+2]==='h'){ out+='っ'; i++; continue; }
  let hit=false;
  for(const L of [3,2,1]){ const sub=s.substr(i,L); if(sub.length===L && R2K[sub]){ out+=R2K[sub]; i+=L; hit=true; break; } }
  if(!hit){ out+=c; i++; }
 }
 return out;
}
const isKana = s => /^[぀-ヿー\s。、？！]+$/.test(s);
function loose(s){
 let r=toRomaji(String(s).toLowerCase()).replace(/[^a-z]/g,'');
 r=r.replace(/shi/g,'si').replace(/chi/g,'ti').replace(/tsu/g,'tu').replace(/fu/g,'hu').replace(/ji/g,'zi').replace(/sh/g,'sy').replace(/ch/g,'ty').replace(/j/g,'zy')
  .replace(/ha/g,'wa').replace(/wo/g,'o').replace(/he/g,'e').replace(/du/g,'zu').replace(/ou/g,'o').replace(/([aiueo])\1+/g,'$1').replace(/nn/g,'n');
 return r;
}
function matchAnswer(v,w){
 const clean = x=>toHira(String(x).replace(/[\s。、？！?!.,]/g,''));
 if(clean(v)===clean(w.w) || clean(v)===clean(w.r)) return true;
 const L=loose(v); if(!L) return false;
 return L===loose(w.r) || (isKana(w.w) && L===loose(w.w));
}
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j);
 for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const sim = (a,b)=> (a&&b) ? 1 - lev(a,b)/Math.max(a.length,b.length) : 0;

let COL=null, writing=false, pushTimer=null, inSession=false, deferred={};
function setSync(s){ const el=document.getElementById('sync'); if(!el) return; el.className='syncdot '+s; el.title={cloud:'Бүх төхөөрөмжтэй синк хийгдсэн',syncing:'Синк хийж байна…',err:'Синк алдаа — энэ төхөөрөмжид хадгалагдсан',local:'Зөвхөн энэ төхөөрөмжид хадгалагдана'}[s]||''; window.SYNC=s; }
function schedulePush(){ if(!COL) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushAll,1200); }
async function pushAll(){
 if(!COL||writing) return; writing=true; setSync('syncing');
 let failed=false;
 while(dirty.size){
  const k=[...dirty][0]; dirty.delete(k);
  const data = k==='meta' ? DB.meta : DB.prof[k.slice(2)];
  if(!data) continue;
  try{ await COL.doc(k).set(clone(data)); }
  catch(e){ dirty.add(k); failed=true; const code=e&&e.code;
   if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='invalid_argument'){ COL=null; setSync('local'); writing=false; return; }
   break; }
 }
 writing=false;
 if(failed){ setSync('err'); setTimeout(pushAll,4000+Math.random()*3000); } else setSync('cloud');
}
function adoptRemote(id,r){
 if(id==='meta'){ if((r.u||0)>(DB.meta.u||0)){ DB.meta=clone(r); pruneProfiles(); return true; } return false; }
 if(id.startsWith('p-')){ const pid=id.slice(2); if(!DB.meta.profiles[pid]) return false; const loc=DB.prof[pid];
  if(!loc || (r.u||0)>(loc.u||0)){ if(inSession && pid===ACTIVE){ deferred[pid]=clone(r); return false; } DB.prof[pid]=clone(r); return true; } }
 return false;
}
function pruneProfiles(){
 for(const pid in DB.prof) if(!DB.meta.profiles[pid]){ if(!DB.prof[pid].u) delete DB.prof[pid]; else { DB.meta.profiles[pid]={name:'Сурагч'}; saveMeta(); } }

}

function homeServerCol(){
 const api=k=>'api/docs'+(k?'/'+encodeURIComponent(k):'');
 const toSnap=(id,d)=>({id,exists:true,data:()=>d,metadata:{hasPendingWrites:false,fromCache:false}});
 const getAll=async()=>{ const r=await fetch(api(),{cache:'no-store'}); if(!r.ok) throw {code:'unavailable'}; const j=await r.json(); return {docs:Object.entries(j).map(([k,v])=>toSnap(k,v))}; };
 return { get:getAll,
  doc:k=>({ set:async d=>{ const r=await fetch(api(k),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}); if(!r.ok) throw {code:'unavailable'}; },
            delete:async()=>{ await fetch(api(k),{method:'DELETE'}); } }),
  onSnapshot:(cb)=>{ const tick=async()=>{ try{ cb(await getAll()); if(window.SYNC!=='syncing') setSync('cloud'); }catch(e){ setSync('err'); } };
   setInterval(tick,20000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(); }); window.addEventListener('focus',tick); return ()=>{}; } };
}
async function initHomeSync(){
 if(!/^https?:$/.test(location.protocol)){ setSync('local'); return; }
 try{ const r=await fetch('api/ping',{cache:'no-store'}); if(!r.ok) throw 0; const j=await r.json(); if(!j||j.app!=='battu-nihongo') throw 0; }catch(e){ setSync('local'); return; }
 window.HOME_SERVER=true; setSync('syncing');
 try{ const col=homeServerCol(); const qs=await col.get(); const seen={}; let changed=false;
  const md=qs.docs.find(d=>d.id==='meta'); if(md){ seen.meta=md.data().u||0; changed=adoptRemote('meta',md.data())||changed; }
  for(const d of qs.docs){ if(d.id==='meta') continue; seen[d.id]=d.data().u||0; changed=adoptRemote(d.id,d.data())||changed; }
  COL=col;
  if((DB.meta.u||0)>(seen.meta||0) && DB.meta.u) dirty.add('meta');
  for(const pid in DB.prof){ const u=DB.prof[pid].u||0; if(u && u>(seen['p-'+pid]||0)) dirty.add('p-'+pid); }
  if(changed){ persistLocal(); if(!inSession) render(); }
  if(dirty.size) pushAll(); else setSync('cloud');
  col.onSnapshot(s=>{ let ch=false; for(const d of s.docs) ch=adoptRemote(d.id,d.data())||ch; if(ch){ persistLocal(); if(!inSession) render(); } });
 }catch(e){ setSync('local'); }
}
async function initSync(){
 if(!window.claude || typeof window.claude.use!=='function'){ return initHomeSync(); }
 setSync('syncing');
 const timer=setTimeout(()=>{ if(window.SYNC==='syncing') setSync('local'); },12000);
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user){ clearTimeout(timer); setSync('local'); return; }
  const id=await user.id(); if(!id){ clearTimeout(timer); setSync('local'); return; }
  const col=db.collection('data/users/'+id);
  const qs=await col.get(); clearTimeout(timer);
  const seen={};
  let changed=false;
  const metaDoc=qs.docs.find(d=>d.id==='meta'); if(metaDoc&&metaDoc.exists){ seen.meta=metaDoc.data().u||0; changed=adoptRemote('meta',metaDoc.data())||changed; }
  for(const d of qs.docs){ if(d.id==='meta'||!d.exists) continue; seen[d.id]=d.data().u||0; changed=adoptRemote(d.id,d.data())||changed; }
  COL=col;
  if((DB.meta.u||0)>(seen.meta||0) && DB.meta.u) dirty.add('meta');
  for(const pid in DB.prof){ const u=DB.prof[pid].u||0; if(u && u>(seen['p-'+pid]||0)) dirty.add('p-'+pid); }
  if(changed){ persistLocal(); if(!inSession) render(); }
  if(dirty.size) pushAll(); else setSync('cloud');
  col.onSnapshot(s=>{ let ch=false; for(const d of s.docs){ if(d.metadata.hasPendingWrites||!d.exists) continue; ch=adoptRemote(d.id,d.data())||ch; } if(ch){ persistLocal(); if(!inSession) render(); } }, ()=>{});
 }catch(e){ clearTimeout(timer); setSync('local'); }
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function toast(msg,ms=2600){ const t=document.createElement('div'); t.className='t'; t.textContent=msg; $('#toast').appendChild(t); setTimeout(()=>t.remove(),ms); }
function confetti(){ const em=['🌸','⭐','🎉','✨','🎌']; for(let i=0;i<28;i++){ const s=document.createElement('span'); s.className='confetti'; s.textContent=pick(em); s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(1.6+Math.random()*1.6)+'s'; s.style.animationDelay=(Math.random()*.4)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),3800); } }
function modal(html){ const m=$('#modal'); $('#mbox').innerHTML=html; m.classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
function confirmModal(title,text,ok='Тийм'){ return new Promise(res=>{ modal(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mNo">Болих</button><button class="btn primary" id="mYes">${esc(ok)}</button></div>`); $('#mNo').onclick=()=>{closeModal();res(false);}; $('#mYes').onclick=()=>{closeModal();res(true);}; }); }
function promptModal(title,{type='text',value='',placeholder='',area=false,hint=''}={}){ return new Promise(res=>{ modal(`<h3>${esc(title)}</h3>${hint?`<p class="small muted">${esc(hint)}</p>`:''}<form id="mForm">${area?`<textarea id="mIn" rows="6" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input id="mIn" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${type==='number'?'inputmode="numeric"':''}>`}<div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="mNo">Болих</button><button class="btn primary">OK</button></div></form>`); const inp=$('#mIn'); setTimeout(()=>inp.focus(),50); $('#mNo').onclick=()=>{closeModal();res(null);}; $('#mForm').onsubmit=e=>{e.preventDefault();closeModal();res(inp.value);}; }); }
async function pinGate(){ if(!DB.meta.pin) return true; const v=await promptModal('Эцэг эхийн PIN код',{type:'password',placeholder:'••••'}); if(v===null) return false; if(v===DB.meta.pin) return true; toast('PIN буруу байна'); return false; }

/* ---- speech ---- */
let JA_VOICE=null;
function loadVoices(){ try{ const vs=speechSynthesis.getVoices(); JA_VOICE=vs.find(v=>/ja[-_]JP/i.test(v.lang)&&/(Kyoko|O-ren|Google|Siri|Nanami)/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null; }catch(e){} }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
let voiceWarned=false;
function say(text,rate){ if(!('speechSynthesis' in window)){ if(!voiceWarned){toast('Энэ браузер дуу унших боломжгүй');voiceWarned=true;} return; }
 try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; if(JA_VOICE) u.voice=JA_VOICE; u.rate=rate||P().set.rate; speechSynthesis.speak(u);
  if(!JA_VOICE && !voiceWarned && speechSynthesis.getVoices().length){ voiceWarned=true; toast('Япон дуу хоолой олдсонгүй — төхөөрөмжийн тохиргооноос японы хоолой нэмээрэй',4500); } }catch(e){} }
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let MIC_OK = !!SR;
function listenJa(){ return new Promise((res,rej)=>{ let r; try{ r=new SR(); }catch(e){ return rej('nosr'); } r.lang='ja-JP'; r.interimResults=false; r.maxAlternatives=5; let got=false, fin=false;
 r.onresult=e=>{ got=true; fin=true; res([...e.results[0]].map(a=>a.transcript)); };
 r.onerror=e=>{ if(fin) return; fin=true; rej(e.error||'err'); };
 r.onend=()=>{ if(!fin){ fin=true; rej('nospeech'); } };
 try{ r.start(); }catch(e){ fin=true; rej('start'); }
 setTimeout(()=>{ try{r.stop();}catch(e){} },7000); }); }
function speechMatch(alts,w){ const n=s=>toHira(String(s)).replace(/[\s。、？！?!.,]/g,''); const W=n(w.w), R=n(w.r);
 return alts.some(a=>{ const A=n(a); return A===W||A===R||A.includes(W)||sim(A,R)>=0.75||sim(A,W)>=0.75; }); }

/* ================= PROGRESS ================= */
const INT=[0,1,2,4,8,16,32];
const RANKS=[[0,'Нахиа','🌱'],[300,'Сурагч','📘'],[1000,'Ниндзя','🥷'],[2500,'Самурай','⚔️'],[5000,'Сэнсэй','🎌'],[10000,'Шогун','🏯']];
const rankOf = xp => { let r=RANKS[0],nx=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){ r=RANKS[i]; nx=RANKS[i+1]||null; } } return {r,nx}; };
const learnedCount = (p,min=3,lvl) => WORDS.filter(w=>(!lvl||w.lvl===lvl)&&(p.srs[w.id]?.b||0)>=min).length;
const dueWords = p => { const now=Date.now(); return WORDS.filter(w=>{const c=p.srs[w.id]; return c&&c.b>0&&c.due<=now;}); };
const BADGES=[
 {id:'first',e:'🌸',n:'Анхны алхам',c:p=>learnedCount(p,1)>=1},
 {id:'w25',e:'📗',n:'25 үг',c:p=>learnedCount(p)>=25},
 {id:'w100',e:'📚',n:'100 үг',c:p=>learnedCount(p)>=100},
 {id:'w200',e:'🏆',n:'200 үг',c:p=>learnedCount(p)>=200},
 {id:'s3',e:'🔥',n:'3 өдөр',c:p=>p.streak>=3},
 {id:'s7',e:'💪',n:'7 өдөр',c:p=>p.streak>=7},
 {id:'s30',e:'👑',n:'30 өдөр',c:p=>p.streak>=30},
 {id:'hira',e:'あ',n:'Хирагана',c:p=>HIRA_ITEMS.every(k=>(p.kana[k.key]?.b||0)>=3)},
 {id:'kata',e:'ア',n:'Катакана',c:p=>KATA_ITEMS.every(k=>(p.kana[k.key]?.b||0)>=3)},
 {id:'n5',e:'🥉',n:'N5 тэнцсэн',c:p=>(p.tests.n5?.best||0)>=80},
 {id:'n4',e:'🥈',n:'N4 тэнцсэн',c:p=>(p.tests.n4?.best||0)>=80},
 {id:'n3',e:'🥇',n:'N3 тэнцсэн',c:p=>(p.tests.n3?.best||0)>=80},
 {id:'writer',e:'✍️',n:'Бичээч',c:p=>p.stats.write>=50},
 {id:'speaker',e:'🗣️',n:'Яригч',c:p=>p.stats.speak>=50},
 {id:'rev100',e:'🔁',n:'100 давталт',c:p=>p.stats.reviews>=100}];
function touchDay(){ const p=P(), t=dayKey(); if(p.today.d===t) return;
 const y=dayKey(Date.now()-864e5);
 p.streak = p.lastDay===y ? p.streak+1 : 1; p.lastDay=t; p.today={d:t,xp:0,newW:0,goal:false};
 if(p.streak>1){ const b=5*Math.min(p.streak,10); p.coins+=b; toast(`🔥 ${p.streak} өдөр дараалан! +${b}⭐`); }
 saveProf(); }
function award(xp,coins){ const p=P(); touchDay(); const before=rankOf(p.xp).r;
 p.xp+=xp; p.coins+=coins; p.today.xp+=xp;
 if(!p.today.goal && p.today.xp>=p.set.goal){ p.today.goal=true; p.coins+=20; toast('🎯 Өнөөдрийн зорилго биеллээ! +20⭐'); }
 const after=rankOf(p.xp).r; if(after!==before){ toast(`${after[2]} Шинэ цол: ${after[1]}!`,3500); confetti(); }
 for(const b of BADGES) if(!p.badges.includes(b.id) && b.c(p)){ p.badges.push(b.id); p.coins+=30; toast(`🏅 Шинэ тэмдэг: ${b.n} (+30⭐)`,3500); }
 saveProf(); updateChips(); }
function srsAnswer(id,ok){ const p=P(); const now=Date.now(); let c=p.srs[id]; if(!c) c=p.srs[id]={b:0,due:0,ok:0,ng:0};
 const isDue = c.b===0 || c.due<=now; let xp=ok?10:0, coins=0; p.stats.answers++;
 if(ok){ c.ok++; p.stats.correct++; if(isDue){ const prev=c.b; c.b=Math.min(c.b+1,6); c.due=now+INT[c.b]*864e5-36e5; if(prev>0){ xp+=5; coins+=2; p.stats.reviews++; } if(prev<3&&c.b>=3) coins+=5; if(prev<6&&c.b===6) coins+=10; } }
 else { c.ng++; c.b=1; c.due=now+10*60e3; }
 return {xp,coins}; }
function kanaAnswer(key,ok){ const p=P(); const c=p.kana[key]||(p.kana[key]={b:0}); p.stats.answers++; if(ok){ p.stats.correct++; const prev=c.b; c.b=Math.min(c.b+1,5); return {xp:6,coins:(prev<3&&c.b>=3)?2:0}; } c.b=Math.max(0,c.b-1); return {xp:0,coins:0}; }

/* ================= QUESTIONS ================= */
function weighted(pool,n){ const p=P(), now=Date.now();
 const sc=w=>{ const c=p.srs[w.id]; if(!c) return 2+Math.random(); if(c.due<=now) return Math.random(); return 1+c.b/7+Math.random()*.8; };
 return pool.map(w=>[sc(w),w]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]); }
const lvlWords = (lvl,f) => WORDS.filter(w=>w.lvl===lvl&&(!f||f(w)));
function distract(w,k,field){ const pool=shuffle(WORDS.filter(x=>x.lvl===w.lvl&&x[field]!==w[field]&&x.r!==w.r&&x.m!==w.m&&x.tag===w.tag)); const out=[], seen=new Set([w[field]]);
 for(const x of pool.concat(shuffle(WORDS.filter(x=>x[field]!==w[field]&&x.r!==w.r)))){ if(!seen.has(x[field])){ seen.add(x[field]); out.push(x); } if(out.length>=k) break; } return out; }
const ruby = w => w.w!==w.r ? `<ruby>${esc(w.w)}<rt>${esc(w.r)}</rt></ruby>` : esc(w.w);
function bigWord(w,reading=true){ const p=P(); return `<div class="bigword jp">${reading?ruby(w):esc(w.w)}</div>${p.set.romaji&&reading?`<div class="romaji">${esc(toRomaji(w.r))}</div>`:''}<button class="iconbtn say" data-act="say" data-arg="${esc(w.r)}" aria-label="Сонсох">🔊</button>`; }
const explainWord = w => `<div class="explain"><span class="jp">${ruby(w)}</span><span class="romaji">${esc(toRomaji(w.r))}</span><span>— <b>${esc(w.m)}</b></span><button class="iconbtn" data-act="say" data-arg="${esc(w.r)}">🔊</button></div>`;
const jpChoice = o => `<span class="jp">${esc(o.w)}</span>${o.w!==o.r?`<small class="jp">${esc(o.r)}</small>`:''}`;
function qMeaning(w){ const opts=shuffle([w,...distract(w,3,'m')]); return {type:'mc',word:w,audio:w.r,auto:true,prompt:`<div class="qlabel">Утгыг нь сонго</div>${bigWord(w)}`,choices:opts.map(o=>({html:esc(o.m),ok:o===w})),reward:ok=>srsAnswer(w.id,ok),explain:()=>explainWord(w)}; }
function qReverse(w){ const opts=shuffle([w,...distract(w,3,'w')]); return {type:'mc',word:w,prompt:`<div class="qlabel">Япон үгийг сонго</div><div class="mnbig">${esc(w.m)}</div>`,choices:opts.map(o=>({html:jpChoice(o),ok:o===w,audio:o.r})),reward:ok=>srsAnswer(w.id,ok),explain:()=>explainWord(w)}; }
function qListen(w){ const opts=shuffle([w,...distract(w,3,'m')]); return {type:'mc',word:w,audio:w.r,auto:true,prompt:`<div class="qlabel">Сонсоод утгыг нь сонго</div><button class="bigplay" data-act="say" data-arg="${esc(w.r)}">🔊</button><div><button class="btn ghost" data-act="sayslow" data-arg="${esc(w.r)}">🐢 Удаан</button></div>`,choices:opts.map(o=>({html:esc(o.m),ok:o===w})),reward:ok=>srsAnswer(w.id,ok),explain:()=>explainWord(w)}; }
function qListenJp(w){ const opts=shuffle([w,...distract(w,3,'r')]); return {type:'mc',word:w,audio:w.r,auto:true,prompt:`<div class="qlabel">Сонссон үгээ сонго</div><button class="bigplay" data-act="say" data-arg="${esc(w.r)}">🔊</button><div><button class="btn ghost" data-act="sayslow" data-arg="${esc(w.r)}">🐢 Удаан</button></div>`,choices:opts.map(o=>({html:`<span class="jp">${esc(o.r)}</span>`,ok:o===w})),reward:ok=>srsAnswer(w.id,ok),explain:()=>explainWord(w)}; }
function qKanjiRead(w){ const opts=shuffle([w,...distract(w,3,'r')]); return {type:'mc',word:w,prompt:`<div class="qlabel">Ханзыг хэрхэн уншдаг вэ?</div><div class="bigword jp">${esc(w.w)}</div><div class="mnsmall">${esc(w.m)}</div>`,choices:opts.map(o=>({html:`<span class="jp">${esc(o.r)}</span>`,ok:o===w,audio:o.r})),reward:ok=>srsAnswer(w.id,ok),explain:()=>explainWord(w)}; }
function qType(w){ return {type:'type',word:w,prompt:`<div class="qlabel">Японоор бич (латин эсвэл кана)</div><div class="mnbig">${esc(w.m)}</div>`,reward:ok=>srsAnswer(w.id,ok),explain:()=>explainWord(w)}; }
function qSentence(s){ const pool=SENTS[s.lvl].length>=4?SENTS[s.lvl]:Object.values(SENTS).flat(); const opts=shuffle([s,...shuffle(pool.filter(x=>x!==s)).slice(0,3)]);
 return {type:'mc',audio:s.s,prompt:`<div class="qlabel">Өгүүлбэрийг уншаад утгыг нь сонго</div><div class="sent jp">${esc(s.s)}</div><button class="iconbtn say" data-act="say" data-arg="${esc(s.s)}">🔊</button>`,choices:opts.map(o=>({html:esc(o.m),ok:o===s})),reward:ok=>{const p=P();p.stats.answers++;if(ok)p.stats.correct++;return {xp:ok?12:0,coins:ok?1:0};},
  explain:()=>`<div class="explain" style="flex-direction:column;align-items:flex-start"><span class="jp">${esc(s.r)}</span><span class="romaji small">${esc(toRomaji(s.r))}</span><b>${esc(s.m)}</b><button class="btn ghost" data-act="say" data-arg="${esc(s.s)}">🔊 Дахин сонсох</button></div>`}; }
function qKana(it,variant,set){ const others=shuffle(set.filter(x=>x.r!==it.r)).slice(0,3); const opts=shuffle([it,...others]);
 const rw=ok=>kanaAnswer(it.key,ok);
 const ex=()=>`<div class="explain"><span class="jp" style="font-size:34px">${esc(it.k)}</span><span class="romaji">${esc(it.r)}</span><button class="iconbtn" data-act="say" data-arg="${esc(it.k)}">🔊</button></div>`;
 if(variant===0) return {type:'mc',audio:it.k,auto:true,prompt:`<div class="qlabel">Энэ үсгийг юу гэж уншдаг вэ?</div><div class="bigword jp" style="font-size:80px">${esc(it.k)}</div>`,choices:opts.map(o=>({html:esc(o.r),ok:o===it})),reward:rw,explain:ex};
 if(variant===1) return {type:'mc',prompt:`<div class="qlabel">«${esc(it.r)}» үсгийг сонго</div><div class="mnbig">${esc(it.r)}</div>`,choices:opts.map(o=>({html:`<span class="jp">${esc(o.k)}</span>`,ok:o===it,audio:o.k})),reward:rw,explain:ex};
 return {type:'mc',audio:it.k,auto:true,prompt:`<div class="qlabel">Сонсоод үсгийг сонго</div><button class="bigplay" data-act="say" data-arg="${esc(it.k)}">🔊</button>`,choices:opts.map(o=>({html:`<span class="jp">${esc(o.k)}</span>`,ok:o===it})),reward:rw,explain:ex}; }
function qSpeak(w){ return {type:'speak',word:w,reward:(ok,info)=>{ const r=srsAnswer(w.id,ok); if(ok){ P().stats.speak++; if(info&&info.self) r.xp=Math.ceil(r.xp/2); else { r.xp+=5; r.coins+=1; } } return r; },explain:()=>explainWord(w)}; }
function qWrite(it,guide){ return {type:'write',item:it,guide,reward:(ok,info)=>{ const r=kanaAnswer(it.key,ok); if(ok){ P().stats.write++; r.xp+= (info.pct>=80?6:2) + (guide?0:4); if(info.pct>=80) r.coins+=1; } return r; }}; }

/* ================= SESSION RUNNER ================= */
let S=null;
function startSession(title,qs,opt={}){ qs=qs.filter(Boolean); if(!qs.length){ toast('Асуулт олдсонгүй'); return; } touchDay(); inSession=true; document.body.classList.add('in-session'); S={title,qs,opt,i:0,correct:0,combo:0,maxCombo:0,xp:0,coins:0,locked:false}; renderQ(); window.scrollTo(0,0); }
function renderQ(){ const q=S.qs[S.i];
 V.innerHTML=`<div class="session"><div class="sbar"><button class="iconbtn" data-act="quit" aria-label="Гарах">✕</button><div class="prog"><div style="width:${S.i/S.qs.length*100}%"></div></div><div class="combo ${S.combo>=2?'on':''}">🔥${S.combo}</div></div><div class="small muted" style="margin:-6px 0 8px">${esc(S.title)} · ${S.i+1}/${S.qs.length}</div><div class="qcard" id="qcard"></div><div id="fb"></div></div>`;
 RENDER[q.type](q,$('#qcard'),(ok,extra,info)=>answered(q,ok,extra,info)); }
function answered(q,ok,extra='',info={}){ if(S.locked) return; S.locked=true;
 const r=q.reward?q.reward(ok,info):{xp:ok?10:0,coins:0};
 if(ok){ S.correct++; S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo); r.xp+=Math.min(S.combo-1,5)*2; } else S.combo=0;
 S.xp+=r.xp; S.coins+=r.coins; award(r.xp,r.coins);
 const fb=$('#fb'); fb.innerHTML=`<div class="feedback ${ok?'good':'bad'}"><div class="fbhead"><span>${ok?pick(['Зөв! 🎉','Гайхалтай! ✨','Сайн байна! 👏','すごい！ 🌟','Мундаг! 💯']):'Буруу байна 😅'}</span>${r.xp?`<span class="gain">+${r.xp} XP${r.coins?` · +${r.coins}⭐`:''}</span>`:''}</div>${extra}${q.explain?q.explain():''}<button class="btn primary wide" data-act="next">Үргэлжлүүлэх →</button></div>`;
 const c=$('.combo'); if(c){ c.textContent='🔥'+S.combo; c.classList.toggle('on',S.combo>=2); }
 setTimeout(()=>{ fb.scrollIntoView({behavior:'smooth',block:'nearest'}); },60); }
function nextQ(){ if(!S) return; S.i++; S.locked=false; if(S.i>=S.qs.length) endSession(); else { renderQ(); window.scrollTo(0,0); } }
function endSession(){ const p=P(); const n=S.qs.length, pct=Math.round(S.correct/n*100); let extra='';
 if(S.opt.test){ const lvl=S.opt.test; const t=p.tests[lvl]||(p.tests[lvl]={best:0,last:0,n:0}); const firstPass=t.best<80&&pct>=80; t.last=pct; t.n++; t.best=Math.max(t.best,pct);
  let bonus=pct>=95?120:pct>=90?100:pct>=80?60:0; if(firstPass) bonus+=100;
  if(bonus){ S.coins+=bonus; award(0,bonus); }
  extra = pct>=80 ? `<div class="notice" style="background:var(--green2);border-color:#a9dcbf">🎌 Тэнцлээ! ${firstPass?'Анх удаа тэнцсэн урамшуулал +100⭐. ':''}Шагнал: +${bonus}⭐</div>` : `<div class="notice">80% ба түүнээс дээш авбал тэнцэнэ. Давтаад дахин оролдоорой! 💪</div>`;
  if(pct>=80) confetti(); saveProf(); }
 else if(pct===100 && n>=5){ S.coins+=10; award(0,10); extra='<div class="notice">💯 Бүгдийг зөв! +10⭐</div>'; confetti(); }
 const stars = pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':pct>=50?'⭐':'';
 const again=S.opt.again;
 V.innerHTML=`<div class="session"><div class="card result"><div style="font-size:40px">${pct>=80?'🎉':pct>=50?'👍':'🌱'}</div><div class="pct">${pct}%</div><div style="font-size:26px;margin:6px 0">${stars}</div><div class="muted">${esc(S.title)}</div>${extra}<div class="stats"><span class="pill">✅ ${S.correct}/${n}</span><span class="pill">✨ +${S.xp} XP</span><span class="pill">⭐ +${S.coins}</span><span class="pill">🔥 Цуврал ${S.maxCombo}</span></div><div class="row center">${again?'<button class="btn" data-act="again">🔁 Дахин</button>':''}<button class="btn primary" data-act="done">Дуусгах</button></div></div></div>`;
 S.done=true; leaveSession(false); }
function leaveSession(rerender=true){ inSession=false; document.body.classList.remove('in-session'); try{speechSynthesis.cancel();}catch(e){}
 for(const pid in deferred){ const r=deferred[pid]; if((r.u||0)>(DB.prof[pid]?.u||0)){ DB.prof[pid]=r; persistLocal(); } } deferred={};
 updateChips(); if(rerender) render(); }

const RENDER={
 mc(q,box,done){ box.innerHTML=q.prompt+`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="num">${i+1}</span><span class="ctext">${c.html}</span></button>`).join('')}</div>`;
  if(q.auto&&q.audio) say(q.audio);
  box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ if(S.locked) return; const c=q.choices[+b.dataset.i]; box.querySelectorAll('.choice').forEach((x,j)=>{ x.disabled=true; if(q.choices[j].ok) x.classList.add('ok'); }); if(!c.ok) b.classList.add('bad'); if(c.audio) say(c.audio); done(c.ok); }); },

/* ---- handwriting ---- */
function drawGlyph(ctx,ch,W,color){ ctx.save(); ctx.fillStyle=color; ctx.font=`600 ${W*0.78}px 'Klee One','Noto Sans JP',sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ch,W/2,W/2+W*0.03); ctx.restore(); }
function makePad(cv,ch,guide){ const wrap=cv.parentElement; const size=Math.max(220,Math.min((wrap.clientWidth||300)-4,340)); const dpr=window.devicePixelRatio||1;
 cv.style.width=cv.style.height=size+'px'; cv.width=cv.height=Math.round(size*dpr); const ctx=cv.getContext('2d'); const strokes=[]; let cur=null, target=false;
 function draw(){ const W=cv.width; ctx.clearRect(0,0,W,W); ctx.fillStyle='#fffdf8'; ctx.fillRect(0,0,W,W);
  ctx.strokeStyle='#eadcc4'; ctx.setLineDash([6*dpr,6*dpr]); ctx.lineWidth=dpr; ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,W); ctx.moveTo(0,W/2); ctx.lineTo(W,W/2); ctx.stroke(); ctx.setLineDash([]);
  if(guide||target) drawGlyph(ctx,ch,W,target?'rgba(200,48,47,.30)':'rgba(44,62,115,.14)');
  ctx.strokeStyle='#1d2233'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=W*0.045;
  for(const s of cur?strokes.concat([cur]):strokes){ ctx.beginPath(); s.forEach((p,i)=>{ const x=p[0]*W,y=p[1]*W; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); if(s.length===1) ctx.lineTo(s[0][0]*W+.5,s[0][1]*W); ctx.stroke(); } }
 const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
 cv.onpointerdown=e=>{ if(target) return; e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){} cur=[pos(e)]; draw(); };
 cv.onpointermove=e=>{ if(!cur) return; e.preventDefault(); cur.push(pos(e)); draw(); };
 const end=()=>{ if(cur){ strokes.push(cur); cur=null; draw(); } }; cv.onpointerup=end; cv.onpointercancel=end;
 try{ document.fonts.load(`600 100px 'Klee One'`,ch).then(draw,draw); }catch(e){} draw();
 return {strokes, undo(){ if(!target){ strokes.pop(); draw(); } }, clear(){ if(!target){ strokes.length=0; draw(); } }, showTarget(){ target=true; draw(); }}; }
async function scoreDrawing(strokes,ch,norm){ try{ await document.fonts.load(`600 100px 'Klee One'`,ch); }catch(e){}
 const N=128; const mk=()=>{ const c=document.createElement('canvas'); c.width=c.height=N; return c.getContext('2d',{willReadFrequently:true}); };
 const t=mk(); drawGlyph(t,ch,N,'#000');
 const td=mk(); drawGlyph(td,ch,N,'#000'); td.strokeStyle='#000'; td.lineWidth=N*0.06; td.lineJoin='round'; td.font=`600 ${N*0.78}px 'Klee One','Noto Sans JP',sans-serif`; td.textAlign='center'; td.textBaseline='middle'; td.strokeText(ch,N/2,N/2+N*0.03);
 const T=t.getImageData(0,0,N,N).data, TD=td.getImageData(0,0,N,N).data;
 let pts=strokes;
 if(norm){ let x0=N,y0=N,x1=0,y1=0; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(T[(y*N+x)*4+3]>60){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const all=strokes.flat(); const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]); const a0=Math.min(...xs),a1=Math.max(...xs),b0=Math.min(...ys),b1=Math.max(...ys);
  const tw=Math.max((x1-x0)/N,.02), th=Math.max((y1-y0)/N,.02), uw=Math.max(a1-a0,.02), uh=Math.max(b1-b0,.02);
  const s=Math.min(tw/uw,th/uh, 4); const cx=(x0+x1)/2/N, cy=(y0+y1)/2/N, ux=(a0+a1)/2, uy=(b0+b1)/2;
  pts=strokes.map(st=>st.map(p=>[cx+(p[0]-ux)*s, cy+(p[1]-uy)*s])); }
 const paint=lw=>{ const c=mk(); c.strokeStyle='#000'; c.lineCap='round'; c.lineJoin='round'; c.lineWidth=lw; for(const st of pts){ c.beginPath(); st.forEach((p,i)=>i?c.lineTo(p[0]*N,p[1]*N):c.moveTo(p[0]*N,p[1]*N)); if(st.length===1) c.lineTo(st[0][0]*N+.5,st[0][1]*N); c.stroke(); } return c.getImageData(0,0,N,N).data; };
 const UT=paint(N*0.08), UN=paint(N*0.035);
 let tc=0,tcov=0,un=0,uin=0; for(let i=3;i<T.length;i+=4){ if(T[i]>60){ tc++; if(UT[i]>60) tcov++; } if(UN[i]>60){ un++; if(TD[i]>60) uin++; } }
 if(!tc||!un) return 0; const R=tcov/tc, Pr=uin/un; return R+Pr ? 2*R*Pr/(R+Pr) : 0; }

const L = () => P().level;

 return shuffle([...take(6).map(qMeaning),...take(3).map(qReverse),...take(4).map(qListen),...shuffle(SENTS[lvl]).slice(0,4).map(qSentence),...take(3).map(qType)]); }

 words(){ const p=P(); const lvl=L(); const ws=lvlWords(lvl);
  V.innerHTML=`<div class="row" style="margin:6px 0 10px"><button class="iconbtn" data-act="back">←</button><h1 style="margin:0">Үгийн жагсаалт</h1></div>${levelChips()}
  <div class="card">${ws.map(w=>{ const b=p.srs[w.id]?.b||0; return `<div class="wl"><button class="iconbtn" data-act="say" data-arg="${esc(w.r)}">🔊</button><div><div class="jp">${esc(w.w)}</div>${w.w!==w.r?`<div class="r jp">${esc(w.r)}</div>`:''}</div><div class="m">${esc(w.m)}<div class="r">${esc(toRomaji(w.r))}</div></div><div class="dots" title="Түвшин ${b}/6">${'●'.repeat(b)}<span style="color:var(--line)">${'●'.repeat(6-b)}</span></div></div>`; }).join('')}</div>`; },
 test(){ const p=P();
  V.innerHTML=`<h1>Шалгалт 📝</h1><p class="muted">Түвшин бүр 20 асуулттай: утга, сонсох, өгүүлбэр унших, бичих. <b>80%</b>-иас дээш авбал тэнцэж, тэмдэг болон урамшууллын оноо авна.</p>
  ${Object.entries(LEVELS).map(([k,l])=>{ const t=p.tests[k]; const got=learnedCount(p,3,k), tot=lvlWords(k).length; return `<div class="card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${l.name} <span class="muted">${l.sub}</span></h3><div class="small muted">Сурсан үг: ${got}/${tot}${t?` · Шилдэг: <b style="color:${t.best>=80?'var(--green)':'var(--ink)'}">${t.best}%</b> · ${t.n} удаа`:''}</div></div><div>${t&&t.best>=80?'🏅':''}</div></div><button class="btn ${t&&t.best>=80?'':'primary'} wide" data-act="startTest" data-arg="${k}">${t?'Дахин өгөх':'Шалгалт өгөх'}</button></div>`; }).join('')}
  <p class="small muted">Зөвлөгөө: шалгалтын өмнө «Үг цээжлэх» болон «Үгийн сорил»-оор бэлдээрэй. 90%+ → 100⭐, 95%+ → 120⭐, анх тэнцвэл +100⭐.</p>`; },
 rewards(){ const p=P(); const rws=DB.meta.rewards;
  V.innerHTML=`<h1>Шагнал 🎁</h1>
  <div class="card coinbig"><div class="muted">${esc(pname())}-ийн шагналын оноо</div><div class="coins">⭐ ${p.coins}</div><div class="small muted">Зөв хариулт, давталт, өдрийн зорилго, дараалсан өдрүүд, тэмдэг, шалгалтаар оноо цуглуулна.</div></div>
  <div class="card"><h3>Оноогоо шагналаар солих</h3>${rws.length?rws.map(r=>`<div class="rw"><div><b>${esc(r.name)}</b><div class="small muted">⭐ ${r.cost}</div></div>${EDIT_RW?`<button class="iconbtn" data-act="delReward" data-arg="${r.id}">🗑</button>`:`<button class="btn ${p.coins>=r.cost?'primary':''}" ${p.coins>=r.cost?'':'disabled'} data-act="redeem" data-arg="${r.id}">${p.coins>=r.cost?'Авах':`${r.cost-p.coins}⭐ дутуу`}</button>`}</div>`).join(''):'<p class="muted">Шагнал алга. Эцэг эх нь нэмж өгнө.</p>'}</div>
  <div class="card"><h3>Эцэг эхэд 👨‍👦</h3><p class="small muted">Хүүхдэдээ урам өгөх шагнал, үнийг нь өөрөө тохируулна. ${DB.meta.pin?'PIN кодоор хамгаалагдсан.':'«Би» хэсэгт PIN код тавьж хамгаалж болно.'}</p><div class="row"><button class="btn" data-act="addReward">＋ Шагнал нэмэх</button><button class="btn ghost" data-act="editRewards">${EDIT_RW?'✓ Дууссан':'✎ Засах'}</button></div></div>
  <div class="card"><h3>Авсан шагналууд</h3>${p.redeemed.length?p.redeemed.slice(0,20).map(x=>`<div class="rw"><span>${esc(x.n)}</span><span class="small muted">⭐${x.cost} · ${x.d}</span></div>`).join(''):'<p class="small muted">Одоохондоо алга.</p>'}</div>`; },
 me(){ const p=P(); const s=p.set; const acc=p.stats.answers?Math.round(p.stats.correct/p.stats.answers*100):0;
  const syncTxt={cloud:(window.HOME_SERVER?'🏠 Гэрийн компьютертэй синк хийгдэж байна — гэрийн Wi-Fi-д холбогдсон бүх төхөөрөмж нэг ахицтай.':'☁️ Бүх төхөөрөмжтэй синк хийгдэж байна (компьютер, iPad, утас — нэг claude.ai бүртгэлээр нэвтэрсэн бол).'),syncing:'⏳ Синк хийж байна…',err:'⚠️ Синк түр алдаатай — энэ төхөөрөмжид хадгалагдсан, дараа нь дахин илгээнэ.',local:'📱 Зөвхөн энэ төхөөрөмжид хадгалагдана. Доорх «Хуулах/Оруулах»-аар өөр төхөөрөмж рүү шилжүүлж болно.'}[window.SYNC]||'';
  V.innerHTML=`<h1>Би 👤</h1>
  <div class="card"><h3>Сурагчид</h3>${Object.entries(DB.meta.profiles).map(([pid,pr])=>{ const pp=DB.prof[pid]; return `<div class="prof ${pid===ACTIVE?'on':''}"><div class="avatar">${esc((pr.name||'?')[0].toUpperCase())}</div><div style="flex:1"><b>${esc(pr.name)}</b><div class="small muted">${pp?`${pp.xp} XP · ⭐${pp.coins} · 🔥${pp.streak}`:''}</div></div>${pid===ACTIVE?'<button class="btn ghost" data-act="renameProf">✎</button>':`<button class="btn" data-act="switchProf" data-arg="${pid}">Сонгох</button>`}${Object.keys(DB.meta.profiles).length>1&&pid!==ACTIVE?`<button class="iconbtn" data-act="delProf" data-arg="${pid}">🗑</button>`:''}</div>`; }).join('')}<button class="btn" data-act="addProf">＋ Сурагч нэмэх</button></div>
  <div class="card"><h3>Статистик</h3><div class="row"><span class="pill">✅ Нарийвчлал ${acc}%</span><span class="pill">📚 Сурсан ${learnedCount(p)} үг</span><span class="pill">🔁 ${p.stats.reviews} давталт</span><span class="pill">🗣️ ${p.stats.speak}</span><span class="pill">✍️ ${p.stats.write}</span></div></div>
  <div class="card"><h3>Тохиргоо</h3>
   <div class="set"><span>Өдрийн зорилго</span><select data-set="goal">${[50,100,200,300].map(v=>`<option ${s.goal==v?'selected':''} value="${v}">${v} XP</option>`).join('')}</select></div>
   <div class="set"><span>Өдөрт шинэ үг</span><select data-set="newPerDay">${[5,10,15,20,30].map(v=>`<option ${s.newPerDay==v?'selected':''} value="${v}">${v}</option>`).join('')}</select></div>
   <div class="set"><span>Ярих хурд</span><input type="range" min="0.5" max="1.2" step="0.1" value="${s.rate}" data-set="rate"><button class="iconbtn" data-act="say" data-arg="こんにちは、よろしくおねがいします">🔊</button></div>
   <div class="set"><span>Латин галиг (romaji) харуулах</span><input type="checkbox" ${s.romaji?'checked':''} data-set="romaji" style="width:22px;height:22px"></div>
   <div class="set"><span>Эцэг эхийн PIN код<div class="small muted">Шагнал засах, сурагч устгахад</div></span><button class="btn" data-act="setPin">${DB.meta.pin?'Солих':'Тавих'}</button></div>
  </div>
  <div class="card"><h3>Хадгалалт</h3><p class="small">${syncTxt}</p><div class="row"><button class="btn" data-act="exportData">📋 Хуулах</button><button class="btn" data-act="importData">📥 Оруулах</button><button class="btn ghost" data-act="resetProf">↺ Ахицыг тэглэх</button></div></div>
  <p class="small muted" style="text-align:center">Battu Nihongo · дуудлага: төхөөрөмжийн япон хоолой · ${WORDS.length} үг, ${Object.values(SENTS).flat().length} өгүүлбэр, ${KANJI.length} ханз</p>`;
  V.querySelectorAll('[data-set]').forEach(el=>el.onchange=()=>{ const k=el.dataset.set; p.set[k]= el.type==='checkbox'?el.checked: el.type==='range'?parseFloat(el.value):parseInt(el.value,10); saveProf(); }); }
};
function modeGrid(full){ const p=P(); const due=dueWords(p).length;
 const m=[['kana','あ','Кана үсэг','Хирагана, катакана'],['cards','🃏','Үг цээжлэх',due?`${due} үг давтах`:'Давталттай карт'],['quiz','🧠','Үгийн сорил','Утга сонгох, бичих'],['listen','👂','Сонсох','Сонсоод таних'],['speak','🗣️','Дуудлага','Чангаар хэлж дадлагажих'],['read','📖','Унших','Өгүүлбэр, ханз'],['write','✍️','Гараар бичих','Кана, ханз зурах'],['words','📒','Үгийн жагсаалт','Бүх үг, ахиц']];
 return `<div class="grid">${m.map(([a,i,n,d])=>`<button class="mode" data-act="mode" data-arg="${a}"><span class="mi ${i.length===1?'jp':''}">${i}</span><b>${n}</b><span>${d}</span></button>`).join('')}</div>`; }

/* ================= ACTIONS ================= */
const ACT={
 say:a=>say(a), sayslow:a=>say(a,0.6),
 setLevel:a=>{ P().level=a; saveProf(); render(); },
 mode:a=>{ const t={quiz:['Үгийн сорил',buildWordQuiz],listen:['Сонсох',buildListen],read:['Унших',buildRead],speak:['Дуудлага',buildSpeak]};
  if(a==='cards') return startCards(); if(['kana','write','words'].includes(a)){ SUB=a; render(); window.scrollTo(0,0); return; }
  const [title,fn]=t[a]; startSession(`${title} · ${LEVELS[L()].sub}`,fn(),{again:()=>ACT.mode(a)}); },
 cards:()=>startCards(),
 back:()=>{ SUB=null; render(); },
 ktab:a=>{ KTAB=a; render(); },
 kanaQuiz:a=>{ const k=KTAB, d=a==='1'; startSession(`${k==='k'?'Катакана':'Хирагана'} сорил`,buildKana(k,d),{again:()=>ACT.kanaQuiz(a)}); },
 writeKana:()=>{ WRITE_KIND=KTAB; SUB='write'; render(); },
 wkind:a=>{ WRITE_KIND=a; render(); }, wguide:a=>{ WRITE_GUIDE=a==='1'; render(); },
 startWrite:()=>startSession(`Бичих · ${{h:'Хирагана',k:'Катакана',j:'Ханз'}[WRITE_KIND]}`,buildWrite(),{again:()=>ACT.startWrite()}),
 startTest:a=>startSession(`Шалгалт · ${LEVELS[a].name} ${LEVELS[a].sub}`,buildTest(a),{test:a,again:()=>ACT.startTest(a)}),
 next:()=>nextQ(),
 quit:async()=>{ if(S && S.i>0 && !(await confirmModal('Гарах уу?','Одоог хүртэлх оноо хадгалагдана.','Гарах'))) return; S=null; leaveSession(); },
 again:()=>{ const f=S&&S.opt.again; S=null; if(f) f(); else render(); },
 done:()=>{ S=null; C=null; leaveSession(); },
 flip:()=>{ C.flip=true; renderCard(); },
 rate:a=>rateCard(+a),
 quitCards:()=>{ C=null; leaveSession(); },
 moreNew:()=>startCards(5),
 redeem:async a=>{ const p=P(); const r=DB.meta.rewards.find(x=>x.id===a); if(!r||p.coins<r.cost) return;
  if(!(await confirmModal('Шагнал авах уу?',`«${r.name}» — ${r.cost}⭐ хасагдана.`,'Авах'))) return;
  p.coins-=r.cost; p.redeemed.unshift({n:r.name,cost:r.cost,d:dayKey()}); saveProf(); confetti(); toast(`🎁 ${r.name}! Эцэг эхдээ хэлээрэй.`,3500); render(); },
 addReward:async()=>{ if(!(await pinGate())) return; const n=await promptModal('Шагналын нэр',{placeholder:'жишээ: Парк явах'}); if(!n||!n.trim()) return; const c=parseInt(await promptModal('Хэдэн оноо (⭐)?',{type:'number',value:'300'}),10); if(!c||c<1) return;
  DB.meta.rewards.push({id:'r'+Date.now().toString(36),name:n.trim().slice(0,60),cost:c}); saveMeta(); render(); },
 editRewards:async()=>{ if(!EDIT_RW && !(await pinGate())) return; EDIT_RW=!EDIT_RW; render(); },
 delReward:a=>{ DB.meta.rewards=DB.meta.rewards.filter(r=>r.id!==a); saveMeta(); render(); },
 switchProf:a=>{ ACTIVE=a; persistLocal(); render(); toast(`👋 ${pname()}`); },
 addProf:async()=>{ const n=await promptModal('Сурагчийн нэр',{placeholder:'жишээ: Баттөр'}); if(!n||!n.trim()) return; const pid='p'+Date.now().toString(36); DB.meta.profiles[pid]={name:n.trim().slice(0,30)}; DB.prof[pid]=newProfile(); ACTIVE=pid; saveMeta(); saveProf(pid); render(); },
 renameProf:async()=>{ const n=await promptModal('Нэр солих',{value:pname()}); if(!n||!n.trim()) return; DB.meta.profiles[ACTIVE].name=n.trim().slice(0,30); saveMeta(); render(); },
 delProf:async a=>{ if(!(await pinGate())) return; if(!(await confirmModal('Устгах уу?',`«${pname(a)}»-ийн бүх ахиц устна.`,'Устгах'))) return; delete DB.meta.profiles[a]; delete DB.prof[a]; saveMeta(); if(COL){ COL.doc('p-'+a).delete().catch(()=>{}); } render(); },
 setPin:async()=>{ if(DB.meta.pin && !(await pinGate())) return; const v=await promptModal('Шинэ PIN (4 орон, хоосон = арилгах)',{type:'password'}); if(v===null) return; DB.meta.pin=v.trim(); saveMeta(); toast(v.trim()?'🔒 PIN тавигдлаа':'PIN арилгалаа'); render(); },
 exportData:async()=>{ const txt=JSON.stringify(DB); try{ await navigator.clipboard.writeText(txt); toast('📋 Хуулагдлаа. Өөр төхөөрөмж дээр «Оруулах» дээр буулгана уу.',3500); }catch(e){ promptModal('Доорх текстийг хуулж аваарай',{area:true,value:txt}); } },
 importData:async()=>{ const v=await promptModal('Хуулсан өгөгдлөө энд буулгана уу',{area:true,hint:'Энэ төхөөрөмжийн одоогийн ахиц солигдоно.'}); if(!v) return; try{ const d=JSON.parse(v); if(!d.meta||!d.prof) throw 0; const now=Date.now(); DB=d; DB.meta.u=now; for(const pid in DB.prof){ DB.prof[pid].u=now; dirty.add('p-'+pid); } dirty.add('meta'); if(!DB.meta.profiles[ACTIVE]) ACTIVE=Object.keys(DB.meta.profiles)[0]; persistLocal(); schedulePush(); toast('✅ Оруулалаа'); render(); }catch(e){ toast('Өгөгдөл буруу байна'); } },
 resetProf:async()=>{ if(!(await confirmModal('Ахицыг тэглэх үү?',`«${pname()}»-ийн бүх оноо, үг, тэмдэг устна.`,'Тэглэх'))) return; const set=P().set; DB.prof[ACTIVE]=newProfile(); DB.prof[ACTIVE].set=set; saveProf(); render(); }
};
document.addEventListener('click',e=>{ const t=e.target.closest('[data-tab]'); if(t){ TAB=t.dataset.tab; SUB=null; EDIT_RW=false; render(); window.scrollTo(0,0); return; }
 const b=e.target.closest('[data-act]'); if(b && !b.disabled && ACT[b.dataset.act]){ e.preventDefault(); ACT[b.dataset.act](b.dataset.arg,b,e); } });
document.addEventListener('keydown',e=>{ if($('#modal').classList.contains('on')) return; if(e.target.tagName==='INPUT'&&e.key!=='Enter') return;
 if(inSession&&S&&!S.done){ if(S.locked&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); nextQ(); return; } if(!S.locked&&/^[1-4]$/.test(e.key)){ const c=document.querySelectorAll('.choice')[+e.key-1]; if(c) c.click(); } }
 if(inSession&&C){ if(e.key===' '&&!C.flip){ e.preventDefault(); C.flip=true; renderCard(); } else if(C.flip&&/^[1-3]$/.test(e.key)) rateCard(+e.key-1); } });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'){ /* keep open: explicit buttons only */ } });

if('serviceWorker' in navigator && (location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
persistLocal(); render(); setSync('local'); initSync();
</script>
</body>
</html>
